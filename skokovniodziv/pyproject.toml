[project]
name = "skokovniodziv"
version = "0.1.0"
description = "Zadatak u kojem je potrebno prikazati skokovni odziv te pripadajuäe vrijednosti"
readme = "README.md"
authors = [
    { name = "bluka1", email = "" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
]

[project.scripts]
skokovniodziv = "skokovniodziv:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
